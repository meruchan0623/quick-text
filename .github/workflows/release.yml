# Release workflow (development plan, section 11 "CI": job `release`; B-52, B-51, S-28).
#
# Trigger: push of a tag vMAJOR.MINOR.PATCH. A manual run (workflow_dispatch) does the same
# build and the same checks as a dry run on the selected branch. Neither publishes anything:
# the workflow has read-only permissions and only uploads workflow artifacts. The maintainer
# creates the GitHub Release by hand from them, after the manual items in
# docs/release-checklist.md.
#
#   licenses  (ubuntu)   cargo deny bans/licenses/sources must pass (S-28, B-51); advisories are
#                        reported but do not block (a new advisory is not a reason to lose a
#                        build, but the maintainer must read it)
#   release   (windows)  needs `licenses`
#     1. tag == package.json == tauri.conf.json == Cargo versions
#     2. before the build, from the manifests alone:
#          - no `fault-injection` / `mock` feature is enabled in the release configuration:
#            `cargo tree -e features` (scripts/check-release-features.ps1, B-52)
#          - the source allowlist covers every workspace crate (check-source-allowlist.ps1)
#     3. cargo test --workspace
#     4. third-party notices (S-28): scripts/generate-third-party-licenses.ps1 writes the
#        copyright and license texts of every distributed Rust crate and npm package and FAILS
#        when one has no license text; the file replaces the committed placeholder in
#        src-tauri/resources, which tauri.conf.json bundles into the installer
#     5. dependency sources (S-28): scripts/package-dependency-sources.ps1 builds
#        Source-deps.zip (cargo vendor --locked plus the registry tarballs of the production npm
#        packages; offline resolution is verified, every vendored file is hash-checked against its
#        .cargo-checksum.json and every tarball against the package-lock.json integrity).
#        Source.zip and Source-deps.zip together are the complete corresponding source, so no
#        binary is produced without it (next step, step 8)
#     6. the NSIS installer (tauri build, release profile). Tauri runs
#        scripts/check-bundle-preconditions.ps1 before it bundles (build.beforeBundleCommand):
#        no installer unless the bundled notice file is the generated one and
#        QT_DEPENDENCY_SOURCES_ZIP is a complete archive for this tree's lock files. Then the
#        placeholder is restored so Source.zip stays clean
#     7. after the build, from the binaries:
#          - the PDB is copied to the archive folder and searched for `debug_inject_fault`;
#            the exe is searched too (scripts/check-binary-strings.ps1, B-52). Method: raw
#            ASCII and UTF-16LE scan; the PDB of this build must contain `quicker_platform`
#            (positive control: a scan of an empty or wrong file would find nothing as well)
#          - the frontend in dist/, as `tauri build` built and embedded it, has no mock backend
#            (scripts/check-embedded-frontend.ps1: dist/ must match the frontend digest recorded
#            in the exe by src-tauri/build.rs, then `node scripts/check-bundle.mjs --scan-only
#            dist`, FE-18; with its own positive control)
#     8. scripts/package-artifacts.ps1 (installer, exe, license text, notices, docs, Source.zip,
#        Source-deps.zip, SHA256SUMS; validates the dependency archive again and refuses without
#        it; before copying it repeats the B-52 and FE-18 checks of steps 2 and 7 on the exact
#        exe it packages and checks that target/release/quicktext.pdb is that exe's PDB,
#        scripts/release-binary-checks.ps1), then check-source-allowlist.ps1 -Strict on the
#        finished ZIP
#     9. license / source-acquisition text for the release description
#    10. upload: package, release notes, and the PDB as a separate artifact
#
# The PDB is not part of the package (it is for offline symbolication of crash records and
# must not ship with the installer). GitHub keeps workflow artifacts for at most 90 days:
# download the symbols artifact and archive it permanently, per version (see the checklist).
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo deny (bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
          arguments: --locked

      - name: cargo deny (advisories, informational)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --locked

  release:
    name: release
    needs: licenses
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The tag name goes through the environment, never into the script text.
      - name: Versions agree (tag, manifests)
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $arguments = @()
          if ($env:TAG) { $arguments = @('-Tag', $env:TAG) }
          pwsh -NoProfile -File scripts/check-release-version.ps1 @arguments

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --- checks that need no build ----------------------------------------------------

      - name: Scanner self-test (B-52)
        run: pwsh -NoProfile -File scripts/check-binary-strings.ps1 -SelfTest

      # The packaging step compares dist/ with the frontend digest recorded in the exe before it
      # scans dist/ (FE-18); this tests that comparison on synthetic files.
      - name: Embedded-frontend check self-test (FE-18)
        run: pwsh -NoProfile -File scripts/check-embedded-frontend.ps1 -SelfTest

      # `cargo tree -e features`: the release configuration of quicktext must not enable
      # fault-injection or mock in any crate. Fails too when no crate defines those features
      # any more (the check would pass vacuously).
      - name: Release enables no fault-injection / mock (B-52)
        run: pwsh -NoProfile -File scripts/check-release-features.ps1

      - name: Source allowlist covers all crates (B-51)
        run: pwsh -NoProfile -File scripts/check-source-allowlist.ps1 -Strict

      - name: Hook-module lints (S-02)
        run: pwsh -NoProfile -File scripts/check-hook-lints.ps1

      # --- build ------------------------------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context! needs ../dist at compile time; `tauri build` rebuilds the
      # real frontend into it afterwards.
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      - name: Test
        run: cargo test --workspace --locked

      # --- third-party notices (S-28) ---------------------------------------------------

      # Fails (and writes nothing) when any distributed crate or npm package has no license
      # text, so the installer can never ship an incomplete notice file. The generated file
      # goes to RUNNER_TEMP first; the copy in src-tauri/resources (committed placeholder,
      # bundled by tauri.conf.json bundle.resources) is overwritten for the build only.
      - name: Generate third-party notices
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'notices/THIRD-PARTY-LICENSES.txt'
          pwsh -NoProfile -File scripts/generate-third-party-licenses.ps1 -OutputFile $notices
          if ($LASTEXITCODE -ne 0) { throw 'Third-party notice generation failed' }
          Copy-Item -LiteralPath $notices -Destination src-tauri/resources/THIRD-PARTY-LICENSES.txt -Force

      # cargo vendor and npm pack need the network; the script verifies the result (every distributed crate
      # vendored, count equals Cargo.lock, offline resolution from the vendored sources alone, every file
      # of every crate and every npm tarball present and matching its checksum or the lock file integrity).
      # Built before the installer: the installer build is gated on it (next step).
      - name: Dependency sources (Source-deps.zip, S-28)
        run: pwsh -NoProfile -File scripts/package-dependency-sources.ps1 -OutputDirectory "$env:RUNNER_TEMP/deps"

      # tauri.conf.json build.beforeBundleCommand runs scripts/check-bundle-preconditions.ps1 after the
      # exe is compiled and before the bundler writes the installer: it fails (no installer) unless
      # the notice file is the generated one and QT_DEPENDENCY_SOURCES_ZIP names a dependency source
      # archive that matches this tree's lock files and is complete.
      - name: Build NSIS installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $env:QT_DEPENDENCY_SOURCES_ZIP = Join-Path $env:RUNNER_TEMP "deps/Quicktext-$env:VERSION-Source-deps.zip"
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      # The bundler read src-tauri/resources/THIRD-PARTY-LICENSES.txt, and tauri-build copied it next
      # to the exe: both must be the generated file, not the placeholder. The installer itself
      # is listed with 7-Zip as an extra look (NSIS layout is not guaranteed to be listable, so
      # that part only warns; the checklist asks for a manual look at an installed copy).
      - name: Installer bundles the generated notice file (S-28)
        run: |
          $expected = (Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'notices/THIRD-PARTY-LICENSES.txt') -Algorithm SHA256).Hash
          foreach ($copy in @('src-tauri/resources/THIRD-PARTY-LICENSES.txt', 'target/release/THIRD-PARTY-LICENSES.txt')) {
            if (-not (Test-Path -LiteralPath $copy -PathType Leaf)) { throw "Missing $copy after the build" }
            if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash -ne $expected) { throw "$copy is not the generated notice file" }
          }
          $installer = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not found' }
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            $candidate = 'C:\Program Files\7-Zip\7z.exe'
            if (Test-Path -LiteralPath $candidate) { $sevenZip = Get-Command $candidate }
          }
          if ($sevenZip) {
            $listing = (& $sevenZip.Source l $installer.FullName) | Out-String
            if ($listing -match 'THIRD-PARTY-LICENSES\.txt') { Write-Host 'installer listing: THIRD-PARTY-LICENSES.txt present' }
            else { Write-Host '::warning::7-Zip does not list THIRD-PARTY-LICENSES.txt in the installer; check an installed copy by hand (docs/release-checklist.md)' }
          } else { Write-Host '::warning::7-Zip not found; check an installed copy by hand (docs/release-checklist.md)' }

      # Source.zip is built from the tree: put the committed placeholder back.
      - name: Restore the notice placeholder
        run: git checkout -- src-tauri/resources/THIRD-PARTY-LICENSES.txt

      # The build must not have edited the lockfiles it was supposed to follow.
      - name: Lockfiles unchanged by the build
        run: git diff --exit-code -- Cargo.lock package-lock.json

      # --- checks on the binaries (B-52) ------------------------------------------------

      - name: Archive PDB
        id: symbols
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $symbols = Join-Path $env:RUNNER_TEMP 'symbols'
          New-Item -ItemType Directory -Path $symbols | Out-Null
          $base = "Quicktext-$env:VERSION-Windows-x64"
          $pdb = 'target/release/quicktext.pdb'
          $exe = 'target/release/quicktext.exe'
          foreach ($file in @($pdb, $exe)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing build output: $file" }
          }
          Copy-Item -LiteralPath $pdb -Destination (Join-Path $symbols "$base.pdb")
          @(
            "version:    $env:VERSION"
            "ref:        $env:GITHUB_REF_NAME ($env:GITHUB_REF_TYPE)"
            "commit:     $env:GITHUB_SHA"
            "rustc:      $(rustc --version)"
            "exe sha256: $((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
            "pdb sha256: $((Get-FileHash -LiteralPath $pdb -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content -LiteralPath (Join-Path $symbols "$base.pdb.txt") -Encoding utf8
          "path=$symbols" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "pdb=$(Join-Path $symbols "$base.pdb")" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      # The forbidden name is looked up in the archived copy. quicker_platform is the positive
      # control: it is in every PDB of this program, so an empty, truncated or wrongly encoded
      # file cannot pass.
      - name: Archived PDB has no debug_inject_fault (B-52)
        run: pwsh -NoProfile -File scripts/check-binary-strings.ps1 "${{ steps.symbols.outputs.pdb }}" -RequirePresent quicker_platform

      - name: Release exe has no debug_inject_fault (B-52)
        run: pwsh -NoProfile -File scripts/check-binary-strings.ps1 target/release/quicktext.exe -RequirePresent com.quicktext.desktop

      # FE-18 on the frontend this build shipped: `tauri build` ran `npm run build`
      # (build.beforeBuildCommand) into dist/ and embedded that output in the exe (compressed, so
      # the exe scan above cannot see it). check-embedded-frontend.ps1 first requires dist/ to have
      # the digest src-tauri/build.rs recorded in the exe (so it is the embedded frontend), then
      # runs `node scripts/check-bundle.mjs --scan-only dist`: scans dist/ as the build left it,
      # without rebuilding; the control build that proves the scan can see the mock goes to a
      # temporary directory. Plain `npm run check:bundle` would rebuild dist/ and scan those builds
      # instead. package-artifacts.ps1 repeats this check on the exe it packages.
      - name: Shipped frontend has no mock backend (FE-18)
        run: pwsh -NoProfile -File scripts/check-embedded-frontend.ps1 -Exe target/release/quicktext.exe -Dist dist

      # --- package ----------------------------------------------------------------------

      # Packaging refuses a missing, placeholder or stale notice file and a missing, damaged, stale
      # or incomplete dependency archive: no release without the complete corresponding source.
      - name: Package (installer, license, notices, Source.zip, Source-deps.zip, SHA256SUMS)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'notices/THIRD-PARTY-LICENSES.txt'
          $deps = Join-Path $env:RUNNER_TEMP "deps/Quicktext-$env:VERSION-Source-deps.zip"
          foreach ($required in @($notices, $deps)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Release precondition missing: $required" }
          }
          pwsh -NoProfile -File scripts/package-artifacts.ps1 -OutputDirectory "$env:RUNNER_TEMP/release" -ThirdPartyLicensesFile $notices -DependencySourcesZip $deps
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }

      - name: Source ZIP covers every crate (B-51)
        run: pwsh -NoProfile -File scripts/check-source-allowlist.ps1 -Strict -Zip "$env:RUNNER_TEMP/release/Quicktext-${{ steps.version.outputs.version }}-Source.zip"

      - name: License and source-acquisition text (S-28)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes/release-notes.md'
          $arguments = @{
            Version       = $env:VERSION
            SourceZip     = Join-Path $env:RUNNER_TEMP "release/Quicktext-$env:VERSION-Source.zip"
            DependencySourcesZip = Join-Path $env:RUNNER_TEMP "release/Quicktext-$env:VERSION-Source-deps.zip"
            RepositoryUrl = $env:REPOSITORY_URL
            Ref           = $env:REF_NAME
            CommitSha     = $env:GITHUB_SHA
            OutputFile    = $notes
          }
          if ($env:IS_TAG -eq 'true') { $arguments['IsTag'] = $true }
          ./scripts/write-release-notes.ps1 @arguments
          Get-Content -LiteralPath $notes -Raw -Encoding utf8 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          '' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          '### SHA256SUMS' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "release/Quicktext-$env:VERSION-SHA256SUMS.txt") -Encoding utf8 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # --- upload -----------------------------------------------------------------------

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Quicktext-${{ steps.version.outputs.version }}-package
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload release notes (license and source acquisition)
        uses: actions/upload-artifact@v4
        with:
          name: Quicktext-${{ steps.version.outputs.version }}-release-notes
          path: ${{ runner.temp }}/release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 90

      # Separate on purpose: symbols are archived per version, not distributed.
      - name: Upload PDB (symbols)
        uses: actions/upload-artifact@v4
        with:
          name: Quicktext-${{ steps.version.outputs.version }}-symbols
          path: ${{ steps.symbols.outputs.path }}/*
          if-no-files-found: error
          retention-days: 90
