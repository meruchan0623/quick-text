# CI for Quicktext (development plan, section 11 "CI").
#
# Jobs and triggers (names match the plan; branch protection should require
# rust-windows, rust-portable, deps and frontend):
#
#   rust-windows   every PR and push   fmt -> hook-module lints (S-02) -> source allowlist
#                                      (B-51) -> clippy -> tests (plain, then with mock +
#                                      fault-injection)
#   rust-portable  every PR            quicker-domain tests on Linux (platform independence)
#   macos-check    every PR            cargo check --workspace (ADR-f: compile check only)
#   deps           every PR; weekly    dependency direction + cargo deny (B-51); the
#                                      advisories check runs weekly / on demand only (the
#                                      weekly cron, not the nightly one)
#   frontend       every PR            typecheck, lint, format, test (FE-53), check:bundle
#                                      (no mock backend in production builds, FE-18), self-test
#                                      of the packaging check on the embedded frontend
#   notices        every PR            every distributed Rust crate and npm package has a license
#                                      text for THIRD-PARTY-LICENSES.txt (S-28); the release
#                                      workflow generates the real file and fails the same way
#   bench          nightly; push to    matching with 1000 rules (crates/domain/benches, B-53),
#                  main; on demand     fails above 120% of the absolute budget, or when any of
#                                      its seven cases is missing or not from this run
#                                      (scripts/check-bench-budget.ps1); target/criterion is
#                                      uploaded for the trend. Not a required check: it does
#                                      not run on pull requests
#
# Not implemented yet (planned in the same table): bindings (0.5), e2e-windows (nightly,
# R-10), frontend test:e2e / test:desktop / size (0.5).
name: ci

on:
  pull_request:
  push:
    branches: ['**']
    tags-ignore: ['**']
  schedule:
    # Weekly (Monday 03:17 UTC): new RustSec advisories show up without any code change.
    # Jobs that react to it compare github.event.schedule with this exact string.
    - cron: '17 3 * * 1'
    # Nightly (02:41 UTC): the bench job only. Same rule: compared as an exact string.
    - cron: '41 2 * * *'
  workflow_dispatch:

concurrency:
  # Scheduled runs get a group per cron entry. Both run on the default branch, so with the ref
  # alone the nightly run would cancel (or be cancelled by) a push to main or the weekly run.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  rust-windows:
    name: rust-windows
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # tauri::generate_context! needs the frontendDist directory (../dist) to exist at
      # compile time; the Rust jobs do not need real frontend assets.
      - name: Create placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      - name: Format
        run: cargo fmt --all -- --check

      # S-02 / B-02: the hook and RawInput callback modules must keep their module-level
      # #![deny(clippy::unwrap_used, ...)]. It is the only thing that still enforces those
      # lints in them, because the clippy step below passes -A for two of them.
      # Fails when crates/platform/src/windows/{hook,rawinput}.rs are missing.
      - name: Hook-module lints (S-02)
        run: pwsh -NoProfile -File scripts/check-hook-lints.ps1

      # B-51: every workspace crate (and every tracked file inside one) must be covered by
      # the source allowlist that feeds Source.zip. The release workflow repeats the check
      # on the finished ZIP with -Strict.
      - name: Source allowlist covers all crates (B-51)
        run: pwsh -NoProfile -File scripts/check-source-allowlist.ps1

      # 0.5 removes the two -A flags (plan section 7.5).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

      - name: Test
        run: cargo test --workspace --locked

      - name: Test (mock + fault-injection)
        run: cargo test --workspace --locked --features mock,fault-injection

  rust-portable:
    name: rust-portable
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Proves the domain crate is platform independent. 0.5 adds `-p quicker-engine`.
      - name: Test quicker-domain
        run: cargo test -p quicker-domain --locked

  macos-check:
    name: macos-check
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create placeholder frontend dist
        run: mkdir -p dist

      # ADR-f: macOS is experimental; CI only proves that everything still compiles.
      - name: Check workspace
        run: cargo check --workspace --locked

  deps:
    name: deps
    # Pull requests, on demand, and the weekly cron (not the nightly bench cron).
    if: github.event_name != 'push' && (github.event_name != 'schedule' || github.event.schedule == '17 3 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependency direction
        run: bash scripts/check-deps-direction.sh

      - name: cargo deny (bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
          arguments: --locked

      # Plan: advisories run weekly, not per PR. A new RustSec advisory can appear against an
      # unchanged Cargo.lock and must not block unrelated pull requests.
      - name: cargo deny (advisories)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1') || github.event_name == 'workflow_dispatch'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --locked

  frontend:
    name: frontend
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `npm run doctor` (0.4) bundles these; they run as separate steps so a failure shows
      # which gate broke.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Test
        run: npm run test

      # FE-18: production builds (plain and VITE_MOCK=1) contain no mock backend, with a
      # control build that proves the scan sees it when it is there. The release workflow scans
      # the dist/ that `tauri build` embeds (--scan-only).
      - name: Bundle has no mock backend (FE-18)
        run: npm run check:bundle

      # The packaging scripts scan dist/ only after matching it against the frontend digest the
      # exe records (scripts/check-embedded-frontend.ps1); this tests that comparison on
      # synthetic files, so a broken check shows up here and not on release day.
      - name: Embedded-frontend check self-test (FE-18)
        run: pwsh -NoProfile -File scripts/check-embedded-frontend.ps1 -SelfTest

  # Early warning for the release gate: a dependency bump that brings in a crate without a
  # license file fails here, not on release day. Checks only, writes nothing
  # (scripts/generate-third-party-licenses.ps1 -CheckOnly). `cargo metadata` fetches the crates
  # it needs; node_modules holds the production npm packages.
  notices:
    name: notices
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Every distributed dependency has a license text (S-28)
        run: pwsh -NoProfile -File scripts/generate-third-party-licenses.ps1 -CheckOnly

  # B-53: per-keystroke matching with 1000 synthetic rules (crates/domain/benches/matching.rs).
  # The gate is absolute: p99 of criterion's per-sample means above 120% of the 1 ms budget
  # fails (statistic: scripts/check-bench-budget.ps1, docs/performance-baseline.md). Earlier
  # runs are not compared; the uploaded target/criterion is for reading the trend by hand.
  # Kept off pull requests and out of the required checks: shared runners are noisy, and a
  # timing failure must not block an unrelated change.
  bench:
    name: bench
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 2 * * *') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Budget check self-test (B-53)
        run: pwsh -NoProfile -File scripts/check-bench-budget.ps1 -SelfTest

      # Codex review 2: judge only results of this run. Delete what the cache or an earlier
      # attempt left in the group's directory and record when the run starts; the check then
      # refuses a missing case and any result written before that time.
      - name: Clear earlier matching results
        run: |
          $results = 'target/criterion/match_1000_rules'
          if (Test-Path -LiteralPath $results) { Remove-Item -LiteralPath $results -Recurse -Force -ErrorAction Stop }
          "BENCH_STARTED=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV

      # No filter after `--`: the check needs all seven cases.
      - name: Matching benchmark (1000 rules)
        run: cargo bench -p quicker-domain --locked --bench matching

      - name: Within 120% of the matching budget (B-53)
        run: pwsh -NoProfile -File scripts/check-bench-budget.ps1 -NotBefore $env:BENCH_STARTED

      - name: Upload criterion results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/criterion
          if-no-files-found: warn
          retention-days: 90
