# Test-signed installers: macOS DMG (arm64) + Windows portable ZIP (no installer), published as a public GitHub pre-release.
#
# Trigger: push of a tag vMAJOR.MINOR.PATCH, or a manual run (workflow_dispatch).
#
# This is NOT the compliance release (release.yml). It skips build.beforeBundleCommand (the release gate that
# demands the generated third-party notices and the dependency-sources archive), so these installers carry no
# distribution compliance files. They are for testing and are always published as a pre-release.
#
# Signing uses self-signed test certificates from repository secrets (all optional):
#   MAC_DEV_CERTIFICATE / MAC_DEV_CERTIFICATE_PASSWORD / MAC_DEV_SIGNING_IDENTITY   base64 .p12 + password + identity name
#   WINDOWS_DEV_CERTIFICATE / WINDOWS_DEV_CERTIFICATE_PASSWORD                      base64 .pfx + password
# Without them the DMG is ad-hoc signed and the Windows exe is unsigned (a warning is printed).
# A self-signed certificate is not trusted by Gatekeeper / SmartScreen: macOS needs right-click -> Open on first launch.
name: installers

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installers as a public pre-release (tags always publish)'
        type: boolean
        default: true

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  macos-dmg:
    name: macos-dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Placeholder frontend dist
        run: mkdir -p dist

      # Tauri imports APPLE_CERTIFICATE into a temporary keychain and signs the .app. Without the secret the
      # identity is "-" (ad-hoc), so the bundle is still a consistently signed bundle.
      - name: Build DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_DEV_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_DEV_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_DEV_SIGNING_IDENTITY || '-' }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::MAC_DEV_CERTIFICATE not set: DMG is ad-hoc signed"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          fi
          npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg \
            --config '{"build":{"beforeBundleCommand":""}}'

      - name: Verify signature
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Quicktext.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|Signature|flags' || true

      - name: Collect DMG
        run: |
          mkdir -p out
          dmg=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          [ -n "$dmg" ] || { echo "DMG not found" >&2; exit 1; }
          cp "$dmg" out/
          cd out && shasum -a 256 *.dmg > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: out/*
          if-no-files-found: error
          retention-days: 30

  windows-portable:
    name: windows-portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      # Portable build: only the exe is compiled (--no-bundle), no installer of any kind is produced.
      - name: Build portable exe
        run: |
          npm run tauri -- build --no-bundle --config '{"build":{"beforeBundleCommand":""}}'
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      # The certificate is self-signed, so the check compares the signer thumbprint instead of validating a
      # trust chain.
      - name: Sign exe (test certificate)
        env:
          CERT_B64: ${{ secrets.WINDOWS_DEV_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_DEV_CERTIFICATE_PASSWORD }}
        run: |
          $exe = 'target/release/quicktext.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing build output: $exe" }
          if (-not $env:CERT_B64) {
            Write-Host '::warning::WINDOWS_DEV_CERTIFICATE not set: exe is unsigned'
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'dev-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $secure = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Get-PfxCertificate -FilePath $pfx -Password $secure
          $result = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          Remove-Item -LiteralPath $pfx -Force
          $check = Get-AuthenticodeSignature -FilePath $exe
          if (-not $check.SignerCertificate -or $check.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "exe signature missing or signer mismatch (status: $($result.Status))"
          }
          Write-Host "exe signed by $($check.SignerCertificate.Subject)"

      - name: Package portable ZIP
        env:
          SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $name = "Quicktext-$version-Windows-x64-Portable"
          $folder = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $folder, out | Out-Null
          Copy-Item -LiteralPath target/release/quicktext.exe -Destination $folder
          Copy-Item -LiteralPath README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination $folder
          Compress-Archive -Path $folder -DestinationPath "out/$name.zip"
          Set-Location out
          "$((Get-FileHash -LiteralPath "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant())  $name.zip" | Set-Content -LiteralPath SHA256SUMS-windows.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: [macos-dmg, windows-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    # Only this job may write; it publishes a public pre-release so the files are downloadable without login.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: files
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="test-${RUN_NUMBER}-${SHA::7}"
          fi
          cat > notes.md <<EOF
          Test-signed installers built from commit \`${SHA}\`.

          - macOS: Apple-silicon DMG, self-signed (not notarized). First launch: right-click the app, then Open.
          - Windows: portable ZIP (unzip and run quicktext.exe, no installer), exe signed with a self-signed test certificate (SmartScreen will warn).
          - Built without the compliance release gate (third-party notices / dependency sources); not for redistribution. The compliance release is \`release.yml\`.

          Checksums: SHA256SUMS-macos.txt, SHA256SUMS-windows.txt.
          EOF
          ls -l files
          gh release create "$tag" files/* --repo "$REPO" --target "$SHA" --prerelease \
            --title "Quicktext test build ${tag}" --notes-file notes.md
