# Test-signed installers: macOS DMG (arm64) + Windows portable ZIP (no installer), published as a public GitHub release.
#
# Trigger: push of a tag vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE, or a manual run (workflow_dispatch).
#
# Versions are SemVer 2.0.0 (scripts/version.mjs; the app's update check reads these releases, src-tauri/src/update.rs):
#   - tag run:    the tag must be v<manifest version> (`npm run version:bump` first). A tag with a prerelease part
#                 (v0.4.0-beta.1) publishes a pre-release, a plain vX.Y.Z a normal release.
#   - manual run: the build is stamped <manifest version>-test.<run number> (or <prerelease>.test.<run number> when the
#                 manifest version is a prerelease already), passed to `tauri build` as "version" so the binary
#                 reports it, and published as the pre-release v<that version>. Later runs sort higher; all of them sort
#                 below the final release of a plain manifest version.
#   Assets: Quicktext_<version>_aarch64.dmg, Quicktext-<version>-Windows-x64-Portable.zip, SHA256SUMS-macos.txt,
#   SHA256SUMS-windows.txt (the app verifies its download against them). The commit sha is in the release notes.
#
# This is NOT the compliance release (release.yml, plain vX.Y.Z tags only). It skips build.beforeBundleCommand (the
# release gate that demands the generated third-party notices and the dependency-sources archive), so these installers
# carry no distribution compliance files.
#
# Signing uses self-signed test certificates from repository secrets (all optional):
#   MAC_DEV_CERTIFICATE / MAC_DEV_CERTIFICATE_PASSWORD / MAC_DEV_SIGNING_IDENTITY   base64 .p12 + password + identity name
#   WINDOWS_DEV_CERTIFICATE / WINDOWS_DEV_CERTIFICATE_PASSWORD                      base64 .pfx + password
# The macOS certificate is required: `scripts/setup-macos-signing.sh --github` stores it (the same one local builds
# use). Every build signed with it has the designated requirement
# `identifier "com.quicktext.desktop" and certificate leaf = H"..."`, so macOS keeps the granted privacy permissions
# across updates; an ad-hoc build (requirement = cdhash) would ask for them again after each update.
# Without the Windows secrets the exe is unsigned (a warning is printed).
# A self-signed certificate is not trusted by Gatekeeper / SmartScreen: macOS needs right-click -> Open on first launch.
name: installers

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installers as a public pre-release (tags always publish)'
        type: boolean
        default: true

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      bundle_version: ${{ steps.version.outputs.bundle_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Manifests agree and are SemVer; a tag must be v<manifest version>. The ref goes through the environment.
      - name: Build version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: node scripts/version.mjs ci --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --run "$RUN_NUMBER" --sha "$SHA"

  macos-dmg:
    name: macos-dmg
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Placeholder frontend dist
        run: mkdir -p dist

      # The self-signed certificate goes into a temporary keychain and signs the .app with `codesign` (as
      # scripts/build-macos.sh does). tauri's own signing only resolves trusted identities, so it is not used here.
      # No ad-hoc fallback: such a build would make macOS ask for the permissions again.
      - name: Import signing certificate
        env:
          CERT: ${{ secrets.MAC_DEV_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MAC_DEV_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MAC_DEV_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$IDENTITY" ]; then
            echo "::error::MAC_DEV_CERTIFICATE / _PASSWORD / MAC_DEV_SIGNING_IDENTITY not set: run scripts/setup-macos-signing.sh --github"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain" | grep -F "\"$IDENTITY\"" >/dev/null \
            || { echo "::error::identity $IDENTITY not found in the imported certificate"; exit 1; }
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The build version replaces tauri.conf.json's; CFBundleVersion takes integers only, so it gets X.Y.Z.
      - name: Build app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLE_VERSION: ${{ needs.version.outputs.bundle_version }}
        run: |
          config=$(printf '{"version":"%s","build":{"beforeBundleCommand":""},"bundle":{"macOS":{"bundleVersion":"%s"}}}' "$VERSION" "$BUNDLE_VERSION")
          npm run tauri -- build --target aarch64-apple-darwin --bundles app --config "$config"

      # Same options as scripts/build-macos.sh: hardened runtime and the bundle identifier, so the designated
      # requirement is `identifier "com.quicktext.desktop" and certificate leaf = H"..."` on every build.
      - name: Sign app
        env:
          IDENTITY: ${{ secrets.MAC_DEV_SIGNING_IDENTITY }}
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Quicktext.app"
          bundle_id=$(node -p "require('./src-tauri/tauri.conf.json').identifier")
          codesign --force --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN" --identifier "$bundle_id" "$app"

      - name: Verify signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Quicktext.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|Signature|flags' || true
          # The permissions survive updates only with this requirement: fixed identifier + certificate hash.
          requirement=$(codesign -d -r- "$app" 2>&1 | grep designated)
          echo "$requirement"
          case "$requirement" in
            *'identifier "com.quicktext.desktop" and certificate leaf = H"'*) ;;
            *) echo "::error::unstable designated requirement (macOS would re-ask for permissions): $requirement"; exit 1 ;;
          esac
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          echo "CFBundleShortVersionString=$short CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          [ "$short" = "$VERSION" ] || echo "::warning::CFBundleShortVersionString is $short, build version is $VERSION"

      # Quicktext_<version>_aarch64.dmg: the signed app and an Applications link, read-only compressed image.
      - name: Package DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Quicktext.app"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" out
          ditto "$app" "$stage/Quicktext.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Quicktext -srcfolder "$stage" -ov -format UDZO "out/Quicktext_${VERSION}_aarch64.dmg"
          cd out && shasum -a 256 *.dmg > SHA256SUMS-macos.txt

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: out/*
          if-no-files-found: error
          retention-days: 30

  windows-portable:
    name: windows-portable
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Placeholder frontend dist
        shell: bash
        run: mkdir -p dist

      # Portable build: only the exe is compiled (--no-bundle), no installer of any kind is produced.
      # The build version replaces tauri.conf.json's (the exe's version resource and the update check use it).
      - name: Build portable exe
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $config = @{ version = $env:VERSION; build = @{ beforeBundleCommand = '' } } | ConvertTo-Json -Compress
          $configFile = Join-Path $env:RUNNER_TEMP 'tauri-build-config.json'
          Set-Content -LiteralPath $configFile -Value $config -Encoding utf8NoBOM
          npm run tauri -- build --no-bundle --config $configFile
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      # The certificate is self-signed, so the check compares the signer thumbprint instead of validating a
      # trust chain.
      - name: Sign exe (test certificate)
        env:
          CERT_B64: ${{ secrets.WINDOWS_DEV_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_DEV_CERTIFICATE_PASSWORD }}
        run: |
          $exe = 'target/release/quicktext.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing build output: $exe" }
          if (-not $env:CERT_B64) {
            Write-Host '::warning::WINDOWS_DEV_CERTIFICATE not set: exe is unsigned'
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'dev-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $secure = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Get-PfxCertificate -FilePath $pfx -Password $secure
          $result = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com'
          Remove-Item -LiteralPath $pfx -Force
          $check = Get-AuthenticodeSignature -FilePath $exe
          if (-not $check.SignerCertificate -or $check.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "exe signature missing or signer mismatch (status: $($result.Status))"
          }
          Write-Host "exe signed by $($check.SignerCertificate.Subject)"

      - name: Package portable ZIP
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $name = "Quicktext-$version-Windows-x64-Portable"
          $folder = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $folder, out | Out-Null
          Copy-Item -LiteralPath target/release/quicktext.exe -Destination $folder
          Copy-Item -LiteralPath README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination $folder
          Compress-Archive -Path $folder -DestinationPath "out/$name.zip"
          Set-Location out
          "$((Get-FileHash -LiteralPath "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant())  $name.zip" | Set-Content -LiteralPath SHA256SUMS-windows.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: [version, macos-dmg, windows-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    # Only this job may write; it publishes a public release so the files are downloadable without login (and by the
    # app's update check, which reads the releases anonymously).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: files
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            kind=(--prerelease)
          else
            kind=(--latest)
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            title="Quicktext ${VERSION}"
            origin="Tag \`${TAG}\`"
          else
            title="Quicktext test build ${VERSION}"
            origin="Manual test build (run ${RUN_NUMBER}) of \`${GITHUB_REF_NAME}\`"
          fi
          cat > notes.md <<EOF
          ${origin}, version \`${VERSION}\`, built from commit \`${SHA}\`.

          - macOS: Apple-silicon DMG, self-signed (not notarized). First launch: right-click the app, then Open.
          - Windows: portable ZIP (unzip and run quicktext.exe, no installer), exe signed with a self-signed test certificate (SmartScreen will warn).
          - Built without the compliance release gate (third-party notices / dependency sources); not for redistribution. The compliance release is \`release.yml\`.

          Checksums: SHA256SUMS-macos.txt, SHA256SUMS-windows.txt.
          EOF
          ls -l files
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A re-run of the same workflow run (same run number, same version): replace the files.
            gh release upload "$TAG" files/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" files/* --repo "$REPO" --target "$SHA" "${kind[@]}" \
              --title "$title" --notes-file notes.md
          fi
