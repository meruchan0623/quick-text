<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quicktext · 匿名浏览器输入手测</title>
<style>body{max-width:920px;margin:32px auto;padding:0 20px;font:16px/1.6 system-ui;color:#243348;background:#f5f7fa}section{background:white;padding:20px;margin:18px 0;border:1px solid #d7dfe7}label{display:block;margin:10px 0}input,textarea,[contenteditable]{box-sizing:border-box;font:inherit;width:100%;padding:10px;border:1px solid #8999aa}button{padding:9px 14px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#57677a}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
<h1>匿名浏览器输入手测</h1><p>仅使用合成缩写 <code>qtzzx</code> 和输出 <code>测试🙂</code>。页面不联网、不保存、不读取密码值；此页面不是自动验收。打开后先暂停监听，按手测矩阵逐项恢复测试。</p>
<section><h2>普通编辑控件</h2><label>input<input id="plain" autocomplete="off"></label><label>textarea<textarea id="area" rows="4"></textarea></label><label>contenteditable（富文本）<div id="rich" contenteditable="true" role="textbox" aria-label="富文本测试区" aria-multiline="true">前文：<b>加粗</b> <span>中间</span> 后文</div></label><div class="columns"><label>maxlength=5（触发词刚好占满）<input id="limited" maxlength="5" autocomplete="off"></label><label>只读（应拒绝）<input id="readonly" readonly value="合成只读正文"></label></div><label>密码（应拒绝，只输入合成测试值）<input id="password" type="password" autocomplete="new-password"></label><label>disabled（不能聚焦）<input disabled value="合成禁用正文"></label></section>
<section><h2>页面脚本改变焦点、光标、正文</h2><p>以下复选框只影响下面的 textarea。打开任一项后重新输入缩写；旧事务应放弃，不能错删或打错控件。</p><label><input style="width:auto" id="focus-change" type="checkbox">第 3 个输入事件后移焦到另一个 input</label><label><input style="width:auto" id="caret-change" type="checkbox">第 3 个输入事件后将光标移到开头</label><label><input style="width:auto" id="transform" type="checkbox">每次 input 后正文转大写</label><label><input style="width:auto" id="async-change" type="checkbox">每次 input 后 80ms 异步追加“异”</label><label>脚本目标<textarea id="scripted" rows="3"></textarea></label><label>接收移焦<input id="focus-target" autocomplete="off"></label><button id="reset" type="button">重置合成数据及事件计数</button></section>
<section><h2>匿名事件记录</h2><small>仅记录控件 ID、事件类型、字符数、光标及 composition 状态；不记录正文、键名或密码值。输入事件不能证明桌面 hook 安全通过。</small><pre id="events" aria-live="polite">尚无事件</pre></section>
<script>
const log=document.getElementById('events');let lines=[],count=0;
function report(e){const t=e.target;if(!t.id||t.type==='checkbox'||t.type==='password')return;const size=t.isContentEditable?t.textContent.length:(t.value||'').length;const caret=typeof t.selectionStart==='number'?t.selectionStart:'不可读取';lines.push(`${new Date().toISOString()} ${t.id} ${e.type} length=${size} caret=${caret} composing=${!!e.isComposing}`);log.textContent=lines.slice(-50).join('\n');}
for(const kind of ['focusin','beforeinput','input','compositionstart','compositionupdate','compositionend'])document.addEventListener(kind,report);
const scripted=document.getElementById('scripted');
scripted.addEventListener('input',()=>{count++;if(document.getElementById('transform').checked)scripted.value=scripted.value.toUpperCase();if(count===3&&document.getElementById('caret-change').checked)scripted.setSelectionRange(0,0);if(count===3&&document.getElementById('focus-change').checked)document.getElementById('focus-target').focus();if(document.getElementById('async-change').checked)setTimeout(()=>{scripted.value+='异';},80);});
document.getElementById('reset').addEventListener('click',()=>{for(const id of ['plain','area','limited','password','scripted','focus-target'])document.getElementById(id).value='';document.getElementById('rich').innerHTML='前文：<b>加粗</b> <span>中间</span> 后文';count=0;lines=[];log.textContent='尚无事件';});
</script></html>
