[package]
name = "quicker-domain"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"

[dev-dependencies]
proptest = "1"
# B-53 matching benchmark; same requirement as quicker-platform, so Cargo.lock gains no package.
criterion = { version = "0.8", default-features = false }

[lints]
workspace = true

# Per-keystroke matching against 1000 synthetic rules (B-53, performance-baseline.md).
# Run with `cargo bench -p quicker-domain --bench matching`; budget gate is
# scripts/check-bench-budget.ps1.
[[bench]]
name = "matching"
harness = false

